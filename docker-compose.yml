services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
      POSTGRES_DB: paperless
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: 
        context: .
        dockerfile: src/Paperless.REST/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Paperless: Host=postgres;Port=5432;Database=paperless;Username=paperless;Password=paperless
    depends_on:
      postgres:
        condition: service_healthy
        
