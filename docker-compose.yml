services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
      POSTGRES_DB: paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: 
        context: src/Paperless.REST
        dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Paperless: Host=postgres;Port=5432;Database=paperless;Username=paperless;Password=paperless
    depends_on:
      postgres:
        condition: service_healthy
        
  webui:
    build: 
        context: src/Paperless.WebUI
        dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      ConnectionStrings__API: Host=localhost;Port=8080