# Die Webseite auf Port 80 bereitstellen
server {
    listen 80;
    # Die HTML-Dateien aus dem Webseiten-Ordner ausliefern
    location / {
        root /usr/share/nginx/html;
        # Bei Angular-URLs die Startseite laden, damit der Router die Seite auswählt
        try_files $uri $uri/ /index.html;
    }
}
